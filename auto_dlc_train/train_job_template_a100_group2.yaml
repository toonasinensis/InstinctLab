jobName: HEFT_train_t3_2gpu_stage3_maxdelay1_agent_test
clusterName: 集群2
priority: 9
podCount: 1
command: |
  export PROJECT_DIR=/mnt/data/mgg/project_2026/motion_tracking
  bash $PROJECT_DIR/tmp/train_t3_2gpu_stage3_maxdelay1.sh
imageName: rl-wbc-a100-rxlu-0703:teleop

# 阿里云规格
specName: NVIDIA-A100
gpuCount: 1

projectName: AWE
resourcePoolName: A100-Group1

