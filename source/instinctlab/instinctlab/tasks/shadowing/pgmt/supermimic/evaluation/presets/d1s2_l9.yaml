# Explicit reproduction of the previous A/B common-cohort evaluation.
environment:
  num_envs: 4000
  episode_length_s: 9999
  seed: 42
  device: cuda:0
  terrain_level: 9
  finish_flat_warmup: true
  terrain_columns: 6
