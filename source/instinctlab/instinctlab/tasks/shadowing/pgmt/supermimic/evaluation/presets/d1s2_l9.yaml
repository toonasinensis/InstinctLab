    slope_down: 0.16666666666666666
    stairs_up: 0.16666666666666666
    stairs_down: 0.16666666666666666
    rough: 0.16666666666666666
  terrain_sampling_weights: {}
  motion_names:
    - dance1_subject2.named.npz
